services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sm_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: sm_library
    ports:
      - "5432:5432"
    volumes:
      - sm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  slskd:
    image: slskd/slskd:latest
    container_name: sm_slskd
    ports:
      - "5030:5030"
      - "5031:5031"
      - "50000:50000"
    volumes:
      - slskd_app:/app/data
      - ./slskd/config/slskd.yml:/app/slskd.yml:ro
      - ${SLSKD_DOWNLOAD_PATH}:/var/slskd/downloads
      - ${SLSKD_DOWNLOAD_PATH}/incomplete:/var/slskd/incomplete
      - ${LIBRARY_ROOT_PATH}:/music:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  sashkomusic:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: sashkomusic
    container_name: smapp
    image: localhost/sashkomusic:latest
    ports:
      - "8085:8080"
    environment:
      - TGBOT_NAME=${TGBOT_NAME}
      - TGBOT_TOKEN=${TGBOT_TOKEN}
      - TGBOT_DEFAULT_CHAT_ID=${TGBOT_DEFAULT_CHAT_ID:-0}
      - TGBOT_LOGS_TOPIC_ID=${TGBOT_LOGS_TOPIC_ID:-}
      - TGBOT_DOWNLOAD_TOPIC_ID=${TGBOT_DOWNLOAD_TOPIC_ID:-}
      - DISCOGS_API_TOKEN=${DISCOGS_API_TOKEN}
      - GOOGLE_VISION_API_KEY=${GOOGLE_VISION_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LIBRARY_ROOT_PATH=${LIBRARY_ROOT_PATH}
      - TRASH_BASE_PATH=${TRASH_BASE_PATH}
      - DOWNLOADS_BASE_PATH=${DOWNLOADS_BASE_PATH}
      - NAVIDROME_BASE_URL=http://navidrome:4533
      - NAVIDROME_USERNAME=${NAVIDROME_USERNAME}
      - NAVIDROME_PASSWORD=${NAVIDROME_PASSWORD}
      - NAVIDROME_LIBRARY_PATH=/music
      - ICECAST_BASE_URL=http://icecast:8000
      - ICECAST_MOUNTPOINT=${ICECAST_MOUNTPOINT:-/stream}
      - ICECAST_TIMEOUT_MS=${ICECAST_TIMEOUT_MS:-5000}
      - SLSKD_API_KEY=${SLSKD_API_KEY}
      - SLSKD_BASE_URL=http://slskd:5030
      - SLSKD_SOULSEEK_USERNAME=${SLSKD_SOULSEEK_USERNAME:-}
      - SLSKD_DOWNLOAD_PATH=${SLSKD_DOWNLOAD_PATH}
      - QOBUZ_EMAIL=${QOBUZ_EMAIL}
      - QOBUZ_PASSWORD=${QOBUZ_PASSWORD}
      - QOBUZ_AUTH_TOKEN=${QOBUZ_AUTH_TOKEN}
      - QOBUZ_CLI_PATH=${QOBUZ_CLI_PATH}
      - QOBUZ_DOWNLOAD_PATH=${QOBUZ_DOWNLOAD_PATH}
      - BANDCAMP_CLI_PATH=${BANDCAMP_CLI_PATH}
      - BANDCAMP_DOWNLOAD_PATH=${BANDCAMP_DOWNLOAD_PATH}
      - APPLE_GAMDL_PATH=${APPLE_GAMDL_PATH}
      - APPLE_GAMDL_COOKIES=${APPLE_GAMDL_COOKIES}
      - APPLE_GAMDL_OUTPUT=${APPLE_GAMDL_OUTPUT}
      - YTDLP_CLI_PATH=${YTDLP_CLI_PATH}
      - YTDLP_DOWNLOAD_PATH=${YTDLP_DOWNLOAD_PATH}
      - YTDLP_COOKIES_PATH=${YTDLP_COOKIES_PATH}
      - PATH_MAPPING_REPROCESS_SOURCE=${PATH_MAPPING_REPROCESS_SOURCE}
      - PATH_MAPPING_REPROCESS_TARGET=${PATH_MAPPING_REPROCESS_TARGET}
      - PATH_MAPPING_PROCESS_SOURCE=${PATH_MAPPING_PROCESS_SOURCE}
      - PATH_MAPPING_PROCESS_TARGET=${PATH_MAPPING_PROCESS_TARGET}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sm_library
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - AUDIO_ANALYZER_URL=http://sm-audio-analyzer:8090
      - SM_SCRAPER_URL=http://sm-scraper:8091
    volumes:
      - ${LIBRARY_ROOT_PATH}:${LIBRARY_ROOT_PATH}
      - ${DOWNLOADS_BASE_PATH}:${DOWNLOADS_BASE_PATH}
      - ${ANALYSIS_RESULTS_PATH}:${ANALYSIS_RESULTS_PATH}:ro
      - ${APPLE_GAMDL_COOKIES}:${APPLE_GAMDL_COOKIES}:ro
      - ${YTDLP_COOKIES_PATH}:${YTDLP_COOKIES_PATH}:ro
    depends_on:
      postgres:
        condition: service_healthy
      slskd:
        condition: service_healthy
    extra_hosts:
      - "host.containers.internal:host-gateway"
    restart: unless-stopped

  sm-scraper:
    build:
      context: ./sm-scraper
      dockerfile: Dockerfile
    container_name: sm_scraper
    ports:
      - "8091:8091"
    environment:
      - BANDCAMP_EMAIL=${BANDCAMP_EMAIL}
      - BANDCAMP_PASSWORD=${BANDCAMP_PASSWORD}
      - BANDCAMP_COOKIES_FILE=/data/bandcamp_cookies.json
    volumes:
      - sm_scraper_data:/data
    restart: unless-stopped

  sm-audio-analyzer:
    platform: linux/amd64
    build:
      context: ./sm-audio-analyzer
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      cache_from:
        - localhost/sm-audio-analyzer:latest
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: localhost/sm-audio-analyzer:latest
    container_name: sm_audio_analyzer
    environment:
      - ANALYSIS_RESULTS_PATH=${ANALYSIS_RESULTS_PATH}
      - ANALYSIS_VERSION=1.0
      - CALLBACK_URL=http://smapp:8080
    volumes:
      - ${LIBRARY_ROOT_PATH}:${LIBRARY_ROOT_PATH}:ro
      - ${ANALYSIS_RESULTS_PATH}:${ANALYSIS_RESULTS_PATH}:rw
    ports:
      - "8090:8090"
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:latest
    container_name: sm_navidrome
    ports:
      - "4533:4533"
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_AUTOIMPORTPLAYLISTS=true
    volumes:
      - ${LIBRARY_ROOT_PATH}:/music:ro
      - navidrome_data:/data
    restart: unless-stopped

  icecast:
    image: infiniteproject/icecast:latest
    container_name: sm_icecast
    ports:
      - "8000:8000"
    environment:
      - ICECAST_ADMIN_USERNAME=${ICECAST_ADMIN_USERNAME:-admin}
      - ICECAST_ADMIN_PASSWORD=${ICECAST_ADMIN_PASSWORD:-hackme}
      - ICECAST_SOURCE_PASSWORD=${ICECAST_SOURCE_PASSWORD:-hackme}
      - ICECAST_RELAY_PASSWORD=${ICECAST_RELAY_PASSWORD:-hackme}
      - ICECAST_HOSTNAME=${ICECAST_HOSTNAME:-localhost}
      - ICECAST_LOCATION=${ICECAST_LOCATION:-Earth}
      - ICECAST_ADMIN_EMAIL=${ICECAST_ADMIN_EMAIL:-admin@localhost}
      - ICECAST_MAX_CLIENTS=${ICECAST_MAX_CLIENTS:-100}
      - ICECAST_MAX_SOURCES=${ICECAST_MAX_SOURCES:-2}
    volumes:
      - icecast_logs:/var/log/icecast
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8000/status-json.xsl || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sm_pgdata:
  slskd_app:
  navidrome_data:
  icecast_logs:
  sm_scraper_data: