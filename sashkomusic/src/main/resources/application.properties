spring.application.name=sashkomusic

# Telegram
telegram.bot.username=${TGBOT_NAME}
telegram.bot.token=${TGBOT_TOKEN}
telegram.default-chat-id=${TGBOT_DEFAULT_CHAT_ID:0}

# External APIs
discogs.api.token=${DISCOGS_API_TOKEN:}

# File paths
library.root-path=${LIBRARY_ROOT_PATH:/Users/okravch/my/sm/lib}
downloads.base-path=${DOWNLOADS_BASE_PATH:/Users/okravch/my/sm/downloads}

# Navidrome
navidrome.base-url=${NAVIDROME_BASE_URL:http://localhost:4533}
navidrome.username=${NAVIDROME_USERNAME:admin}
navidrome.password=${NAVIDROME_PASSWORD:admin}
navidrome.api-version=1.16.1
navidrome.client-name=sashkomusic
navidrome.library-path=${NAVIDROME_LIBRARY_PATH:/music}

# Icecast
icecast.enabled=true
icecast.base-url=${ICECAST_BASE_URL:http://localhost:8000}
icecast.mountpoint=${ICECAST_MOUNTPOINT:/stream}
icecast.timeout-ms=${ICECAST_TIMEOUT_MS:5000}

# Slskd (download-agent settings)
slskd.api-key=${SLSKD_API_KEY:}
slskd.downloads.container-path=/var/slskd/downloads
slskd.downloads.local-path=${SLSKD_DOWNLOAD_PATH:/Users/okravch/my/sm/downloads/slskd}

# Qobuz
qobuz.email=${QOBUZ_EMAIL:}
qobuz.password=${QOBUZ_PASSWORD:}
qobuz.auth-token=${QOBUZ_AUTH_TOKEN:}
qobuz.cli-path=${QOBUZ_CLI_PATH:/Library/Frameworks/Python.framework/Versions/3.12/bin/rip}
qobuz.download-path=${QOBUZ_DOWNLOAD_PATH:/Users/okravch/my/sm/downloads/qobuz}
qobuz.search-limit=5

# Apple Music
applemusic.gamdl.path=/Library/Frameworks/Python.framework/Versions/3.12/bin/gamdl
applemusic.gamdl.cookies=/Users/okravch/my/sm/downloads/cookies.txt
applemusic.gamdl.output=/Users/okravch/my/sm/downloads/apple-music

# Bandcamp
bandcamp.cli-path=${BANDCAMP_CLI_PATH:/opt/homebrew/bin/bandcamp-dl}
bandcamp.download-path=${BANDCAMP_DOWNLOAD_PATH:/Users/okravch/my/sm/downloads/bandcamp}

# Processing
processing.version=1

# AI
langchain4j.anthropic.chat-model.api-key=${ANTHROPIC_API_KEY:}
langchain4j.anthropic.chat-model.base-url=https://api.anthropic.com/v1/
langchain4j.anthropic.chat-model.model-name=claude-haiku-4-5-20251001
langchain4j.anthropic.chat-model.max-tokens=1024
langchain4j.anthropic.chat-model.timeout=60s
langchain4j.anthropic.chat-model.max-retries=5
langchain4j.anthropic.chat-model.log-requests=false
langchain4j.anthropic.chat-model.log-responses=false

# Agents
agents.main.model-name=claude-sonnet-4-6
agents.main.max-tokens=2048
agents.discovery.model-name=claude-haiku-4-5-20251001
agents.discovery.max-tokens=1024

# Path mapping for volume mounts
path.mapping.enabled=true
path.mapping.reprocess-source=${PATH_MAPPING_REPROCESS_SOURCE:/Volumes/Music/}
path.mapping.reprocess-target=${PATH_MAPPING_REPROCESS_TARGET:/mnt/media_hdd/lib/}
path.mapping.process-source=${PATH_MAPPING_PROCESS_SOURCE:/Volumes/Downloads/}
path.mapping.process-target=${PATH_MAPPING_PROCESS_TARGET:/opt/sashko-music/downloads/}

# Library organization
library.organization.enabled=true

# File watching
watch.enabled=true

# Scheduled sync (fallback)
sync.enabled=true
sync.interval=3600000
sync.library-path=${library.root-path}

# Tag changes notification
tag-changes.batch.interval=60000

# Audio analyzer REST bridge
audio-analyzer.url=${AUDIO_ANALYZER_URL:http://localhost:8090}

# Scraper service
sm.scraper.url=${SM_SCRAPER_URL:http://localhost:8091}

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/sm_library
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.maximum-pool-size=10

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== Resilience4j Circuit Breaker =====

resilience4j.circuitbreaker.configs.local-service.sliding-window-type=TIME_BASED
resilience4j.circuitbreaker.configs.local-service.sliding-window-size=60
resilience4j.circuitbreaker.configs.local-service.minimum-number-of-calls=3
resilience4j.circuitbreaker.configs.local-service.failure-rate-threshold=60
resilience4j.circuitbreaker.configs.local-service.slow-call-rate-threshold=80
resilience4j.circuitbreaker.configs.local-service.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.configs.local-service.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.configs.local-service.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.local-service.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.configs.external-api.sliding-window-type=TIME_BASED
resilience4j.circuitbreaker.configs.external-api.sliding-window-size=120
resilience4j.circuitbreaker.configs.external-api.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.external-api.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.external-api.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.configs.external-api.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.configs.internal.sliding-window-type=TIME_BASED
resilience4j.circuitbreaker.configs.internal.sliding-window-size=90
resilience4j.circuitbreaker.configs.internal.minimum-number-of-calls=3
resilience4j.circuitbreaker.configs.internal.failure-rate-threshold=40
resilience4j.circuitbreaker.configs.internal.wait-duration-in-open-state=15s

resilience4j.circuitbreaker.configs.download-service.sliding-window-type=TIME_BASED
resilience4j.circuitbreaker.configs.download-service.sliding-window-size=120
resilience4j.circuitbreaker.configs.download-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.download-service.failure-rate-threshold=60
resilience4j.circuitbreaker.configs.download-service.slow-call-rate-threshold=80
resilience4j.circuitbreaker.configs.download-service.slow-call-duration-threshold=5s
resilience4j.circuitbreaker.configs.download-service.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.configs.download-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.download-service.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.configs.p2p-service.sliding-window-type=TIME_BASED
resilience4j.circuitbreaker.configs.p2p-service.sliding-window-size=120
resilience4j.circuitbreaker.configs.p2p-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.p2p-service.failure-rate-threshold=70
resilience4j.circuitbreaker.configs.p2p-service.slow-call-rate-threshold=90
resilience4j.circuitbreaker.configs.p2p-service.slow-call-duration-threshold=60s
resilience4j.circuitbreaker.configs.p2p-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.p2p-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.p2p-service.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.navidromeClient.base-config=local-service
resilience4j.circuitbreaker.instances.icecastClient.base-config=local-service
resilience4j.circuitbreaker.instances.musicBrainzClient.base-config=external-api
resilience4j.circuitbreaker.instances.discogsClient.base-config=external-api
resilience4j.circuitbreaker.instances.bandcampClient.base-config=external-api
resilience4j.circuitbreaker.instances.slskdClient.base-config=p2p-service
resilience4j.circuitbreaker.instances.slskdClient.ignore-exceptions=com.sashkomusic.downloadagent.infrastructure.client.slskd.NoSearchResultsException
resilience4j.circuitbreaker.instances.itunesSearchClient.base-config=download-service
resilience4j.circuitbreaker.instances.qobuzClient.base-config=download-service
resilience4j.circuitbreaker.instances.bandcampSearchClient.base-config=download-service

# ===== Resilience4j Retry =====

resilience4j.retry.configs.local-service.max-attempts=3
resilience4j.retry.configs.local-service.wait-duration=200ms
resilience4j.retry.configs.local-service.enable-exponential-backoff=true
resilience4j.retry.configs.local-service.exponential-backoff-multiplier=1.5
resilience4j.retry.configs.local-service.exponential-max-wait-duration=1s

resilience4j.retry.configs.external-api.max-attempts=3
resilience4j.retry.configs.external-api.wait-duration=2s
resilience4j.retry.configs.external-api.enable-exponential-backoff=true
resilience4j.retry.configs.external-api.exponential-backoff-multiplier=2
resilience4j.retry.configs.external-api.exponential-max-wait-duration=10s

resilience4j.retry.configs.download-service.max-attempts=3
resilience4j.retry.configs.download-service.wait-duration=3s
resilience4j.retry.configs.download-service.enable-exponential-backoff=true
resilience4j.retry.configs.download-service.exponential-backoff-multiplier=2
resilience4j.retry.configs.download-service.exponential-max-wait-duration=10s

resilience4j.retry.configs.p2p-service.max-attempts=4
resilience4j.retry.configs.p2p-service.wait-duration=2s
resilience4j.retry.configs.p2p-service.enable-exponential-backoff=true
resilience4j.retry.configs.p2p-service.exponential-backoff-multiplier=1.5
resilience4j.retry.configs.p2p-service.exponential-max-wait-duration=8s

resilience4j.retry.instances.navidromeClient.base-config=local-service
resilience4j.retry.instances.icecastClient.base-config=local-service
resilience4j.retry.instances.musicBrainzClient.base-config=external-api
resilience4j.retry.instances.musicBrainzClient.retry-exceptions=com.sashkomusic.mainagent.search.client.musicbrainz.exception.SearchNotCompleteException
resilience4j.retry.instances.discogsClient.base-config=external-api
resilience4j.retry.instances.bandcampClient.base-config=external-api
resilience4j.retry.instances.slskdClient.base-config=p2p-service
resilience4j.retry.instances.slskdClient.ignore-exceptions=com.sashkomusic.downloadagent.infrastructure.client.slskd.NoSearchResultsException
resilience4j.retry.instances.itunesSearchClient.base-config=download-service
resilience4j.retry.instances.qobuzClient.base-config=download-service
resilience4j.retry.instances.bandcampSearchClient.base-config=download-service

# ===== Resilience4j Rate Limiter =====

resilience4j.ratelimiter.instances.musicBrainzClient.limit-for-period=1
resilience4j.ratelimiter.instances.musicBrainzClient.limit-refresh-period=1s
resilience4j.ratelimiter.instances.musicBrainzClient.timeout-duration=5s

# ===== Resilience4j Time Limiter =====

resilience4j.timelimiter.configs.default.timeout-duration=10s
resilience4j.timelimiter.instances.navidromeClient.timeout-duration=10s
resilience4j.timelimiter.instances.musicBrainzClient.timeout-duration=30s
resilience4j.timelimiter.instances.bandcampClient.timeout-duration=45s
resilience4j.timelimiter.instances.slskdClient.timeout-duration=120s
resilience4j.timelimiter.instances.itunesSearchClient.timeout-duration=10s
resilience4j.timelimiter.instances.qobuzClient.timeout-duration=45s
resilience4j.timelimiter.instances.bandcampSearchClient.timeout-duration=30s

# ===== Actuator =====

management.endpoints.web.exposure.include=health,metrics,circuitbreakers,retries,ratelimiters
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.metrics.export.simple.enabled=true
